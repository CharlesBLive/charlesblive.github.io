<!DOCTYPE html>
<html lang="en">
<head>
  <!-- =========================
       Metadata
       ========================= -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Email Chatbot — Charles Biffin</title>

  <!-- =========================
       Main site styles
       ========================= -->
  <link rel="stylesheet" href="../../assets/style.css" />

  <!-- =========================
       Chatbot-specific styles
       ========================= -->
  <link rel="stylesheet" href="../../assets/chatbot.css" />
</head>

<body>
  <!-- =========================================================
       NAVIGATION (shared)
  ========================================================== -->
  <nav class="navbar">
    <div class="container nav-inner">
      <div class="brand">
        <div class="name">Charles Biffin</div>
        <div class="tagline">Email Tone Rewriter (AI Workflow Demo)</div>
      </div>

      <div class="nav-links">
        <a href="../../index.html" class="nav-button">Home</a>
        <a href="../../projects.html" class="nav-button active">Projects</a>
        <a href="../../links.html" class="nav-button">Links</a>
      </div>
    </div>
  </nav>

  <!-- =========================================================
       CHATBOT UI
       - Clean, recruiter-friendly demo layout
       - You can keep expanding this later (history, copy button, etc.)
  ========================================================== -->
  <main class="chatbot-wrap">
    <div class="chatbot-grid">
      <!-- =========================
           INPUT CARD
           ========================= -->
      <section class="chatbot-card">
        <h2>Email Rewriter</h2>
        <p>
          Paste your email, pick a tone, and generate a rewrite.
          <span class="small">(If your API endpoint isn’t configured, you’ll see an error message.)</span>
        </p>

        <!-- User input -->
        <label for="emailInput">Your email</label>
        <textarea id="emailInput" placeholder="Paste your email draft here..."></textarea>

        <!-- Tone selection -->
        <label for="toneSelect">Tone</label>
        <select id="toneSelect">
          <option value="professional">Professional</option>
          <option value="friendly">Friendly</option>
          <option value="direct">Direct</option>
          <option value="empathetic">Empathetic</option>
          <option value="confident">Confident</option>
        </select>

        <!-- Actions -->
        <div class="row">
          <button class="btn accent" id="rewriteBtn" type="button">Rewrite</button>
          <button class="btn" id="clearBtn" type="button">Clear</button>
        </div>

        <p class="small" id="statusText"></p>
      </section>

      <!-- =========================
           OUTPUT CARD
           ========================= -->
      <section class="chatbot-card">
        <h2>Rewritten output</h2>
        <div class="output" id="outputBox">Your rewritten email will appear here…</div>

        <div class="row">
          <button class="btn" id="copyBtn" type="button">Copy output</button>
        </div>
      </section>
    </div>
  </main>

  <!-- =========================================================
       Script
  ========================================================== -->
  <script src="chatbot.js"></script>
</body>
</html>
